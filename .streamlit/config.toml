# Theme for the ClaimsSQL-Trust demo app: dark only (no light/dark switch).
#
# Colour has one meaning everywhere in the app:
#   green  = answered correctly
#   amber  = refused safely (the "orange" colour token is set to amber)
#   red    = wrong answer
# Only [theme] is set, which locks the appearance to this dark theme.

[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0A0D0C"
secondaryBackgroundColor = "#141917"
codeBackgroundColor = "#111614"
textColor = "#E7ECEA"
linkColor = "#4ADE80"
borderColor = "#232B28"
codeTextColor = "#D7E0DC"
grayColor = "#8A9590"
greenColor = "#22C55E"
orangeColor = "#F59E0B"
yellowColor = "#FBBF24"
redColor = "#EF4444"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
chartCategoricalColors = ["#22C55E", "#F59E0B", "#EF4444", "#60A5FA", "#A78BFA", "#8A9590"]
dataframeBorderColor = "#232B28"
dataframeHeaderBackgroundColor = "#141917"
dataframeHeaderTextColor = "#E7ECEA"

showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 16
headingFontSizes = ["44px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [800, 700, 650, 600, 600, 600]
metricValueFontSize = "40px"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "2.5rem"
paddingBottom = "4rem"

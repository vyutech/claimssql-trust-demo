# Schema catalogue for ClaimsSQL-Trust.
#
# Drafted by scripts/make_catalogue.py. Descriptions and code meanings are taken
# from the CMS Linkable 2008-2010 Medicare DE-SynPUF Codebook
# (https://www.cms.gov/files/document/de-10-codebook.pdf-0).
# Reviewed by the project owner, who also writes the `notes` fields.
#
# An entry named PREFIX_1..N stands for the columns PREFIX_1 ... PREFIX_N.
# include: false keeps a column out of the prompt.

source:
  title: CMS Linkable 2008-2010 Medicare DE-SynPUF Codebook
  url: https://www.cms.gov/files/document/de-10-codebook.pdf-0
tables:
- name: beneficiary
  grain: one row per beneficiary per year
  description: 'CMS Beneficiary Summary DE-SynPUF: each record pertains to a synthetic Medicare beneficiary. The
    2008, 2009 and 2010 yearly files are stacked; the year column says which file a row came from.'
  columns:
  - name: DESYNPUF_ID
    type: VARCHAR
    description: Beneficiary Code
    include: true
    codes: {}
    notes: ''
  - name: BENE_BIRTH_DT
    type: BIGINT
    description: Date of birth
    include: true
    codes: {}
    notes: ''
  - name: BENE_DEATH_DT

    type: VARCHAR
    description: Sex
    include: true
    codes:
      '1': Male
      '2': Female
    notes: ''
  - name: BENE_RACE_CD
    type: VARCHAR
    description: Beneficiary Race Code
    include: true
    codes:
      '1': White
      '2': Black
      '3': Others
      '5': Hispanic
    notes: ''
  - name: BENE_ESRD_IND
    type: VARCHAR
    description: End stage renal disease Indicator
    include: true
    codes:
      '0': The beneficiary does not have esrd
      Y: The beneficiary has esrd
    notes: ''
  - name: SP_STATE_CODE
    type: VARCHAR
    description: State Code
    include: true
